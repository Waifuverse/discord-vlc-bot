name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check public files
        run: python scripts/check_public_files.py --ref HEAD
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -LiteralPath . -Filter '*.ps1' | ForEach-Object {
            $scriptTokens = $null
            $scriptErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$scriptTokens, [ref]$scriptErrors) | Out-Null
            $failures += $scriptErrors
          }
          if ($failures.Count -gt 0) { $failures; exit 1 }
